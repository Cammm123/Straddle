name: Straddle
options:
  bundleIdPrefix: com.cameronkani
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  Straddle:
    type: application
    platform: iOS
    sources:
      - path: Straddle
        excludes:
          - Resources/Assets.xcassets/README.md
    settings:
      base:
        PRODUCT_NAME: Straddle
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronkani.straddle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Straddle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - StraddleTests
      gatherCoverageData: true
  StraddleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StraddleTests
    dependencies:
      - target: Straddle
    settings:
      base:
        PRODUCT_NAME: StraddleTests
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronkani.straddle.tests
        GENERATE_INFOPLIST_FILE: YES
